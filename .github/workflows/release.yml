name: Release Equalizer APO VST3 + Loudness Correction

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v3.0.0)"
        required: true
        default: "v3.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release x64 Installer
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s .\tests -p "test_*.py" -v

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          msbuild-architecture: x64

      - name: Build installer
        shell: pwsh
        run: |
          .\scripts\build-installer-x64.ps1 `
            -Configuration "Release"

      - name: Test runtime loudness processing
        shell: pwsh
        run: .\scripts\test-runtime-loudness.ps1 -Configuration "Release"

      - name: Verify release inputs
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          $version = .\scripts\get-project-version.ps1
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match version.h ($version)."
          }
          $path = "Setup/EqualizerAPO-x64-$version.exe"
          if (!(Test-Path -LiteralPath $path)) { throw "Installer not found: $path" }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "path=$path" >> $env:GITHUB_OUTPUT
          "checksum=$path.sha256" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Equalizer APO 64 (VST3 + Loudness Correction) ${{ steps.release.outputs.tag }}
          files: |
            ${{ steps.release.outputs.path }}
            ${{ steps.release.outputs.checksum }}
            NOTICE.md
          fail_on_unmatched_files: true
          generate_release_notes: true
